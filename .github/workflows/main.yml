name: CI Pipeline

on:
  push: {}
  pull_request:
    branches: "main"

jobs:
  trait-test-and-build:
    uses: ./.github/workflows/test-and-build.yml
    with:
      service-name: trait

  trait-docker-build:
    needs: trait-test-and-build
    uses: ./.github/workflows/build-and-push-docker.yml
    with:
      service-name: trait
    secrets: inherit